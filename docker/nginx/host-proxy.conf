# ISPU-DEPLOY: vhost dibuat otomatis oleh deploy.sh. Meneruskan __DOMAIN__ ke container di 127.0.0.1:__PORT__
map $http_x_forwarded_proto $ispu_fwd_proto___ID__ {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ispu_fwd_proto___ID__;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
