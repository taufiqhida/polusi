services:
  app:
    build: ./docker
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./data:/data
    depends_on: [db]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ispu
      MYSQL_USER: ispu
      MYSQL_PASSWORD: ${DB_PASSWORD:-ispu_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    command: --local-infile=1
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
